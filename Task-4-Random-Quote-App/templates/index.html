<!DOCTYPE html>
<html>
<head>
    <title>Random Quote Generator</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="container">

    <h1>✨ Random Quote Generator</h1>

    <div class="quote-box">

        <p id="quote">
            Click the button to get a quote
        </p>

        <h3 id="author"></h3>

        <button onclick="getQuote()">
            Get New Quote
        </button>

    </div>

    <h2>📜 Quote History</h2>

    <div id="history"></div>

</div>

<script src="/static/script.js"></script>

</body>
</html>
